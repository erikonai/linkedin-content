<meta charset="utf-8">
<style>
  @font-face { font-family: Denim; src: url("../brand/Denim-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: Denim; src: url("../brand/Denim-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: InterCF; src: url("../brand/Inter-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: InterCF; src: url("../brand/Inter-Medium.woff2") format("woff2"); font-weight: 500; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; }
  body {
    background: #F9F9F8;
    font-family: InterCF, Arial, sans-serif;
    color: #142D25;
    padding: 64px 72px 52px 72px;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .kicker {
    font-size: 18px; letter-spacing: 3px; font-weight: 500;
    color: #FF862F; text-transform: uppercase;
  }
  .mark { height: 44px; }
  h1 {
    font-family: Denim, Arial, sans-serif;
    font-size: 48px; font-weight: 500;
    line-height: 1.16;
    color: #142D25;
    margin: 40px 0 28px;
    max-width: 980px;
  }
  .rule {
    width: 72px; height: 4px; background: #FF862F;
    margin-bottom: 36px; border-radius: 2px;
  }
  .stack { display: flex; flex-direction: column; gap: 20px; }
  .label {
    font-size: 18px; letter-spacing: 2px; font-weight: 500;
    color: #FF862F; text-transform: uppercase;
  }
  .line { font-size: 32px; line-height: 1.35; color: #4E615B; max-width: 900px; }
  .punchline {
    margin-top: auto;
    background: #142D25; color: #F9F9F8;
    font-family: Denim, Arial, sans-serif; font-size: 28px; line-height: 1.35;
    padding: 32px 36px; border-radius: 10px;
  }
  .footer {
    margin-top: 28px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  .footer img { height: 28px; }
</style>
<div class="top">
  <div class="kicker">Four entities</div>
  <img class="mark" src="../brand/campfire-flame.png" alt="">
</div>
<h1>The job. The logins. The person.</h1>
<div class="rule"></div>
<div class="stack">
  <div class="label">Craziest part</div>
  <p class="line">It’s the same person.</p>
  <p class="line">I’ve sat next to that person. A couple of times I was that person.</p>
</div>
<div class="punchline">Four logins is not a close. It’s a commute.</div>
<div class="footer"><img src="../brand/campfire-logo.png" alt="Campfire"></div>
