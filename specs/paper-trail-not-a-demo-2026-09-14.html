<meta charset="utf-8">
<style>
  @font-face { font-family: Denim; src: url("../brand/Denim-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: Denim; src: url("../brand/Denim-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: InterCF; src: url("../brand/Inter-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: InterCF; src: url("../brand/Inter-Medium.woff2") format("woff2"); font-weight: 500; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; }
  body {
    background: #F9F9F8;
    font-family: InterCF, Arial, sans-serif;
    color: #142D25;
    padding: 64px 72px 52px 72px;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .kicker {
    font-size: 18px; letter-spacing: 3px; font-weight: 500;
    color: #FF862F; text-transform: uppercase;
  }
  .mark { height: 44px; }
  .stack {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 980px;
  }
  .stack p {
    font-family: Denim, Arial, sans-serif;
    font-size: 40px; font-weight: 500;
    line-height: 1.22;
    color: #142D25;
  }
  .rule {
    width: 72px; height: 4px; background: #FF862F;
    margin: 36px 0;
    border-radius: 2px;
  }
  .support { font-size: 28px; line-height: 1.45; color: #4E615B; max-width: 860px; }
  .punchline {
    margin-top: auto;
    background: #142D25; color: #F9F9F8;
    font-family: Denim, Arial, sans-serif; font-size: 28px; line-height: 1.35;
    padding: 32px 36px; border-radius: 10px;
  }
  .footer {
    margin-top: 28px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  .footer img { height: 28px; }
</style>
<div class="top">
  <div class="kicker">The same thread</div>
  <img class="mark" src="../brand/campfire-flame.png" alt="">
</div>
<div class="stack">
  <p>Someone from CS told me Ember was landing.</p>
  <p>The Controller wasn’t sure.</p>
  <p>They were looking at the same Slack thread.</p>
</div>
<div class="rule"></div>
<p class="support">Then she asked if she could take it to the PBC list.</p>
<div class="punchline">I used to get excited about the fluent part. Now I wait for the boring part.</div>
<div class="footer"><img src="../brand/campfire-logo.png" alt="Campfire"></div>
