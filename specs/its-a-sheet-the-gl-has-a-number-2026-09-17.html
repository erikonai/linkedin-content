<meta charset="utf-8">
<style>
  @font-face { font-family: Denim; src: url("../brand/Denim-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: Denim; src: url("../brand/Denim-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: InterCF; src: url("../brand/Inter-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: InterCF; src: url("../brand/Inter-Medium.woff2") format("woff2"); font-weight: 500; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; }
  body {
    background: #F9F9F8;
    font-family: InterCF, Arial, sans-serif;
    color: #142D25;
    padding: 72px 80px 56px 80px;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .kicker {
    font-size: 18px; letter-spacing: 3px; font-weight: 500;
    color: #FF862F; text-transform: uppercase;
  }
  .mark { height: 48px; }
  .quote {
    margin: auto 0;
    font-family: Denim, Arial, sans-serif;
    font-size: 56px;
    font-weight: 500;
    line-height: 1.18;
    color: #142D25;
    max-width: 980px;
  }
  .rule {
    width: 80px; height: 4px; background: #FF862F;
    margin: 40px 0 32px;
    border-radius: 2px;
  }
  .note {
    font-size: 28px;
    line-height: 1.4;
    color: #4E615B;
    max-width: 820px;
  }
  .footer {
    margin-top: auto;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  .footer img { height: 32px; }
</style>
<div class="top">
  <div class="kicker">Prepaid</div>
  <img class="mark" src="../brand/campfire-flame.png" alt="">
</div>
<div class="quote">“It’s a sheet. The GL has a number.”</div>
<div class="rule"></div>
<div class="note">Prepaid never lived on the entry.</div>
<div class="footer"><img src="../brand/campfire-logo.png" alt="Campfire"></div>
