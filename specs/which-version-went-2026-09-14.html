<meta charset="utf-8">
<style>
  @font-face { font-family: Denim; src: url("../brand/Denim-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: Denim; src: url("../brand/Denim-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: InterCF; src: url("../brand/Inter-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: InterCF; src: url("../brand/Inter-Medium.woff2") format("woff2"); font-weight: 500; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 1200px; overflow: hidden; }
  body {
    background: #F9F9F8;
    font-family: InterCF, Arial, sans-serif;
    color: #142D25;
    padding: 64px 72px 52px 72px;
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .kicker {
    font-size: 18px; letter-spacing: 3px; font-weight: 500;
    color: #FF862F; text-transform: uppercase;
  }
  .mark { height: 44px; }
  h1 {
    font-family: Denim, Arial, sans-serif;
    font-size: 42px; font-weight: 500;
    line-height: 1.18;
    color: #142D25;
    margin: 36px 0 28px;
    max-width: 980px;
  }
  .rule {
    width: 72px; height: 4px; background: #FF862F;
    margin-bottom: 32px; border-radius: 2px;
  }
  .log { display: flex; flex-direction: column; gap: 22px; }
  .row { display: flex; gap: 28px; align-items: baseline; }
  .time {
    font-size: 22px; font-weight: 500; color: #FF862F;
    letter-spacing: 0.04em; width: 92px; flex-shrink: 0;
  }
  .line { font-size: 28px; line-height: 1.35; color: #4E615B; }
  .punchline {
    margin-top: auto;
    background: #142D25; color: #F9F9F8;
    font-family: Denim, Arial, sans-serif; font-size: 26px; line-height: 1.35;
    padding: 32px 36px; border-radius: 10px;
  }
  .footer {
    margin-top: 28px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  .footer img { height: 28px; }
</style>
<div class="top">
  <div class="kicker">The file</div>
  <img class="mark" src="../brand/campfire-flame.png" alt="">
</div>
<h1>What a day looks like when you “have the file.”</h1>
<div class="rule"></div>
<div class="log">
  <div class="row"><span class="time">14:00</span><span class="line">CFO: can you send the pack.</span></div>
  <div class="row"><span class="time">14:08</span><span class="line">“The pack” is four files.</span></div>
  <div class="row"><span class="time">15:30</span><span class="line">CFO: which version went to the board.</span></div>
  <div class="row"><span class="time">16:47</span><span class="line">Folder: USE_THIS_actual</span></div>
</div>
<div class="punchline">I could not tell you, an hour later, how to pull the same numbers again.</div>
<div class="footer"><img src="../brand/campfire-logo.png" alt="Campfire"></div>
